      - work2/original-keel-cutwater-20261121
    paths:
      - 'WebPreview/**'
      - '.github/workflows/work2-shipyard-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work2-shipyard-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm ci / tests / TypeScript and Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: WebPreview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPreview/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Execute all browser-free game unit tests
        run: npm test
      - name: Build WebPreview (do NOT publish)
        run: npm run build
