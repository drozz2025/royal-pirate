name: WORK 2 Shipyard — Feature verification (no deploy)

on:
  push:
    branches:
      - work2/shipyard-ownership-class-polish-20261119
      - work2/verified-player-level-gate-20261119
      - work2/shared-preview-geometries-20261119
      - work2/fabric-lifecycle-class-silhouette-20261119
      - work2/class-ownership-gpu-cleanup-20261119
      - work2/shared-preview-geometries-20261119
      - work2/class-pennants-20261119
      - work2/shipyard-class-presets-helm-20261119
      - work2/original-standing-rigging-20261119
      - work2/original-stern-heraldry-20261119
      - work2/original-armour-20261119
      - work2/original-cabin-gallery-20261119
      - work2/shipyard-camera-presets-20261120
      - work2/shipyard-part-focus-20261120
      - work2/original-modular-cannon-collars-20261120
      - work2/original-prow-figureheads-20261120
  pull_request:
    branches:
      - work2/original-stern-heraldry-20261119
      - work2/modular-ships-levels-1-20
      - work2/shipyard-ownership-class-polish-20261119
      - work2/verified-player-level-gate-20261119
      - work2/original-standing-rigging-20261119
      - work2/original-armour-20261119
      - work2/shipyard-part-focus-20261120
    paths:
      - 'WebPreview/**'
      - '.github/workflows/work2-shipyard-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work2-shipyard-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm ci / tests / TypeScript and Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: WebPreview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPreview/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Execute all browser-free game unit tests
        run: npm test
      - name: Build WebPreview (do NOT publish)
        run: npm run build
