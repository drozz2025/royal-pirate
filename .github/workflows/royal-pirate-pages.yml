name: Publish Royal Pirate Web Preview (GitHub Pages)

on:
  push:
    branches:
      - work6/web-3d-preview
    paths:
      - 'WebPreview/**'
      - '.github/workflows/royal-pirate-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: royal-pirate-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: WebPreview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebPreview/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test game
        run: npm test
      - name: Build preview for project path
        run: npm run build -- --base=/royal-pirate/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebPreview/dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
